<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>背诵小练习</title>
  <style>
    :root { --ink:#18243a; --muted:#69758a; --paper:#fffdf9; --line:#e7e1d8; --brand:#6151d8; --good:#177a57; --bad:#bf3d42; --gold:#f2bc3e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(120deg,#f5f2ff 0%,#f7fbff 48%,#fff7eb 100%); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .shell { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:38px 0 52px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:flex-end; margin-bottom:25px; }
    h1 { font-size:clamp(28px,5vw,44px); letter-spacing:-.045em; margin:0 0 7px; }
    header p { color:var(--muted); margin:0; font-size:15px; }
    .card { background:rgba(255,253,249,.9); border:1px solid rgba(255,255,255,.8); box-shadow:0 18px 50px rgba(44,52,92,.11); border-radius:23px; }
    .study { padding:clamp(22px,4vw,45px); min-height:430px; display:flex; flex-direction:column; }
    .progress-row { display:flex; align-items:center; justify-content:space-between; gap:18px; color:var(--muted); font-size:14px; }
    .bar { height:7px; background:#e9e6f5; border-radius:9px; overflow:hidden; flex:1; max-width:360px; }
    .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#8073e8,#5042c5); transition:.35s; border-radius:inherit; }
    .tag { margin-top:43px; font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--brand); text-transform:uppercase; }
    .prompt { font-family:Georgia,"Times New Roman",serif; font-size:clamp(24px,4vw,37px); line-height:1.46; letter-spacing:.005em; margin:11px 0 32px; max-width:900px; }
    .prompt .blank { display:inline-block; min-width:90px; border-bottom:3px solid var(--brand); color:transparent; margin:0 3px; vertical-align:baseline; }
    .answer-area { display:flex; gap:10px; align-items:stretch; max-width:650px; }
    .answer-area.multi { flex-wrap:wrap; max-width:820px; }
    .answer-area.multi input { flex:1 1 220px; }
    input { min-width:0; flex:1; border:2px solid #dbd7ee; border-radius:13px; padding:14px 16px; color:var(--ink); background:white; outline:none; font-size:18px; transition:.2s; }
    input:focus { border-color:var(--brand); box-shadow:0 0 0 4px #eae7ff; }
    button { cursor:pointer; border:0; border-radius:13px; padding:0 19px; color:#fff; font-size:15px; font-weight:700; background:var(--brand); transition:transform .15s,filter .15s; }
    button:hover { filter:brightness(1.06); transform:translateY(-1px); }
    .feedback { min-height:31px; margin-top:15px; font-size:15px; font-weight:600; }
    .good { color:var(--good); } .bad { color:var(--bad); }
    .actions { display:flex; gap:12px; margin-top:auto; padding-top:30px; }
    .secondary { background:#eeeafc; color:#5042a8; padding:12px 15px; }
    .next { margin-left:auto; padding:12px 19px; }
    .quick-create { margin-top:22px; padding:22px 24px 24px; }
    .quick-create h2 { margin:0; font-size:19px; letter-spacing:-.02em; }
    .quick-create textarea { margin-top:8px; min-height:165px; }
    .quick-create label { display:block; }
    .quick-create .save { min-height:44px; padding:0 18px; }
    .generator-status { display:inline-block; margin-left:12px; color:var(--muted); font-size:14px; }
    .editor { margin-top:22px; overflow:hidden; }
    details summary { list-style:none; cursor:pointer; padding:19px 24px; font-weight:700; display:flex; justify-content:space-between; }
    details summary::-webkit-details-marker { display:none; }
    details summary::after { content:'＋'; font-size:21px; color:var(--brand); font-weight:400; }
    details[open] summary::after { content:'−'; }
    .edit-body { border-top:1px solid var(--line); padding:0 24px 24px; }
    .hint { color:var(--muted); font-size:14px; line-height:1.65; margin:15px 0 10px; }
    code { background:#f0edf9; color:#5042a8; border-radius:4px; padding:1px 5px; }
    textarea { width:100%; min-height:190px; resize:vertical; font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; border:1px solid #ded8ee; border-radius:12px; padding:13px; outline:none; }
    textarea:focus { border-color:var(--brand); }
    .save { margin-top:12px; min-height:41px; }
    .empty { text-align:center; margin:auto; color:var(--muted); }
    @media(max-width:560px) { .shell{width:min(100% - 20px,1080px);padding-top:20px} header{align-items:flex-start;flex-direction:column}.study{min-height:480px}.answer-area{flex-direction:column}.answer-area button{min-height:48px}.prompt{margin-top:9px}.actions{flex-wrap:wrap}.next{margin-left:0} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>背诵小练习</h1><p>看提示，写答案。每一条编号内容都是一道题。</p></div>
      <p id="score">答对 0 / 0</p>
    </header>
    <section class="card study" aria-live="polite">
      <div class="progress-row"><span id="counter">准备开始</span><div class="bar"><i id="progress"></i></div></div>
      <div id="exercise"></div>
    </section>
    <section class="card quick-create" aria-labelledby="quick-title">
      <h2 id="quick-title">粘贴文本，自动挖空</h2>
      <p class="hint">按数字、引号内容、德语名词/专有名词和较长关键词等线索，在本地挑选重点；每个自然段生成一道题，可能包含多个空。原文不会上传。</p>
      <label for="plain-text" class="hint">原文</label>
      <textarea id="plain-text" aria-label="粘贴需要挖空的原文" placeholder="在这里粘贴文本……"></textarea>
      <button class="save" id="generate">本地关键词挖空并加载题目</button>
      <span class="generator-status" id="generator-status" role="status" aria-live="polite"></span>
    </section>
    <section class="card editor">
      <details>
        <summary>替换学习文本</summary>
        <div class="edit-body">
          <p class="hint">用两个下划线包住需要背诵的内容，例如 <code>65 - von __Studenten__</code>。每一行是一道题；一行有多个填空时，需要全部填写。修改后点击“加载新文本”。</p>
          <textarea id="source" aria-label="学习文本"></textarea>
          <button class="save" id="load">加载新文本</button>
        </div>
      </details>
    </section>
  </main>
  <script>
    const initial = `Wer interessiert sich an Übersetzung
Wer interessiert sich für den Beruf?
65 - von __Studenten__
66 - __von jüngeren Autoren__

Merkmale des Berufs
67 - ein __freier Beruf__
68 - __der Berufseinstieg für Anfänger schwierig__
69 - __die Bezahlung ist so gering__

Notwindige Wörterbücher
70 - __Gute zweisprachige Wörterbücher__
71 - __einsprachig Wörterbücher mit genauen Bedeutungangaben__
72 - Wörterbücher, die __Synonyme__ in allen Bedeutung Varianten enthalten
Warum gibt es weniger Übersetzungen aus „Kleinen" Sprachen?
73 - In den __Verlagen__ gibt es praktisch keine __Lektoren__, die diese Sprachen mächtig sind.
Kaum __Rezensionen__ zu diesen Titeln (sind daher nicht bekannt)
74 - __die fehlenden oder hoffnungslos veralteten Wörterbücher__`;

    const source = document.querySelector('#source');
    const exercise = document.querySelector('#exercise');
    const score = document.querySelector('#score');
    const counter = document.querySelector('#counter');
    const progress = document.querySelector('#progress');
    let questions = [], current = 0, correct = 0, results = [], answerVisible = false;
    source.value = localStorage.getItem('recite-source') || initial;

    function clean(s) { return s.trim().replace(/\s+/g, ' ').toLocaleLowerCase(); }
    function parse(text) {
      const result = [];
      const lines = text.split(/\r?\n/);
      lines.forEach((line, lineIndex) => {
        let found, cursor = 0, regex = /__([^_][\s\S]*?)__/g;
        const answers = [], parts = [];
        while ((found = regex.exec(line))) {
          parts.push(line.slice(cursor, found.index));
          answers.push(found[1].trim());
          cursor = found.index + found[0].length;
        }
        if (!answers.length) return;
        parts.push(line.slice(cursor));
        const previous = lines.slice(0, lineIndex).reverse().find(item => item.trim()) || '';
        result.push({ answers, parts, previous, lineIndex });
      });
      return result;
    }
    function selectBlanks(text) {
      const candidates = [];
      const fillers = new Set('der die das den dem des ein eine einen einem einer und oder aber wenn weil dass zu von mit für als auf in im am an aus bei nach über unter durch gegen seit um vor zwischen ist sind war waren wird werden sein haben hatte hat kann können muss müssen soll sollen nicht auch noch nur sehr mehr weniger man es sie er wir ihr ich wer was wie warum wo damit dadurch darin dabei darüber hierzu dort dann so als ob welcher welche welches dieser diese dieses jene jener sich selbst schon erst immer oft jedoch daher außerdem zum zur vom beim ins ans aufs who what which where and the a an is are was were be been being have has had do does did can could will would shall should may might must not no nor yet so than too very in on at to for of with by from as into about between before after above below under'.split(/\s+/u));
      function add(start, end, score) {
        if (end <= start) return;
        candidates.push({ start, end, score });
      }
      for (const match of text.matchAll(/["„“«]([^"„“”»]{2,80})["“”»]/gu)) {
        const offset = match.index + match[0].indexOf(match[1]);
        add(offset, offset + match[1].length, 13 + Math.min(4, match[1].length / 20));
      }
      for (const match of text.matchAll(/\d+(?:[.,]\d+)*(?:\s?(?:%|€|Jahre?|Jahren))?/gu)) {
        add(match.index, match.index + match[0].length, 12);
      }
      const tokens = [...text.matchAll(/[\p{L}][\p{L}'’\-–]*/gu)];
      tokens.forEach((token, index) => {
        const word = token[0], lower = word.toLocaleLowerCase();
        if (word.length < 4 || fillers.has(lower)) return;
        if (/^[A-ZÄÖÜ]/u.test(word)) {
          let start = token.index, phraseWords = 1;
          for (let back = index - 1; back >= 0 && phraseWords < 3; back--) {
            const previous = tokens[back], gap = text.slice(previous.index + previous[0].length, start);
            if (/[.!?。！？;；\n]/u.test(gap) || fillers.has(previous[0].toLocaleLowerCase())) break;
            if (previous[0].length < 3) break;
            start = previous.index;
            phraseWords++;
          }
          const before = text.slice(0, token.index);
          const sentenceStart = !before.trim() || /[.!?。！？]\s*$/u.test(before);
          const score = 5 + Math.min(3, word.length / 5) + (phraseWords - 1) * 1.5 + (sentenceStart ? -1.5 : 1.5);
          add(start, token.index + word.length, score);
        } else if (word.length >= 7) {
          add(token.index, token.index + word.length, 2 + Math.min(3, word.length / 5));
        } else if (word.length >= 5) {
          add(token.index, token.index + word.length, 1 + word.length / 10);
        }
      });
      if (!candidates.length) return '';
      const wordCount = tokens.length;
      const maxBlanks = Math.max(1, Math.min(5, Math.ceil(wordCount / 14)));
      const selected = [];
      candidates.sort((a, b) => b.score - a.score || (b.end - b.start) - (a.end - a.start));
      for (const candidate of candidates) {
        if (selected.some(item => candidate.start < item.end && candidate.end > item.start)) continue;
        selected.push(candidate);
        if (selected.length >= maxBlanks) break;
      }
      selected.sort((a, b) => a.start - b.start);
      let output = '', cursor = 0;
      for (const item of selected) {
        output += text.slice(cursor, item.start) + '__' + text.slice(item.start, item.end) + '__';
        cursor = item.end;
      }
      return output + text.slice(cursor);
    }
    function formatPlainText(text) {
      let number = 0;
      return text.trim().split(/\n\s*\n/).map(paragraph => {
        const plain = paragraph.split(/\r?\n/).map(line => line.trim().replace(/^\d+\s*[-.)、:：]\s*/, '').replace(/__/g, '')).filter(Boolean).join(' ');
        if (!plain) return '';
        const question = selectBlanks(plain);
        if (!question) return '';
        number++;
        return number + ' - ' + question;
      }).filter(Boolean).join('\n\n');
    }
    function render() {
      if (!questions.length) { exercise.innerHTML='<p class="empty">还没有找到填空。请在文本中用两个下划线标记需要背诵的内容。</p>'; counter.textContent='没有题目'; score.textContent='答对 0 / 0'; progress.style.width='0%'; return; }
      const q = questions[current];
      counter.textContent = `第 ${current + 1} 题，共 ${questions.length} 题`;
      score.textContent = `答对 ${correct} / ${questions.length}`;
      progress.style.width = `${(current / questions.length) * 100}%`;
      const questionText = q.parts.map((part, index) => `${escapeHtml(part)}${index < q.answers.length ? `<span class="blank">${'　'.repeat(Math.max(3,Math.min(12,q.answers[index].length)))}</span>` : ''}`).join('');
      const inputs = q.answers.map((answer, index) => `<input class="answer" autocomplete="off" placeholder="填空 ${index + 1}" />`).join('');
      exercise.innerHTML = `<div class="tag">前文提示</div><div class="prompt">${q.previous ? `<small style="display:block;font:600 15px/1.5 system-ui;color:#69758a;letter-spacing:0;margin-bottom:12px">${escapeHtml(q.previous.replace(/__([^_][\s\S]*?)__/g, '____'))}</small>` : ''}${questionText}</div><div class="answer-area multi">${inputs}<button id="check">检查答案</button></div><div class="feedback" id="feedback"></div><div class="feedback" id="revealedAnswer" hidden></div><div class="actions"><button class="secondary" id="prev" ${current === 0 ? 'disabled' : ''}>← 上一题</button><button class="secondary" id="reveal">显示答案</button><button class="next" id="next">${current === questions.length - 1 ? '重新开始' : '下一题 →'}</button></div>`;
      const answerInputs = [...document.querySelectorAll('.answer')]; answerInputs[0].focus();
      document.querySelector('#check').onclick = check;
      answerInputs.forEach(input => input.onkeydown = e => { if(e.key === 'Enter') check(); });
      document.querySelector('#reveal').onclick = () => {
        answerVisible = !answerVisible;
        const revealed = document.querySelector('#revealedAnswer');
        revealed.hidden = !answerVisible;
        revealed.innerHTML = answerVisible ? `<span class="bad">答案：${q.answers.map((answer, index) => `填空 ${index + 1}：${escapeHtml(answer)}`).join('；')}</span>` : '';
        document.querySelector('#reveal').textContent = answerVisible ? '隐藏答案' : '显示答案';
      };
      document.querySelector('#prev').onclick = previous;
      document.querySelector('#next').onclick = next;
    }
    function check() {
      const values = [...document.querySelectorAll('.answer')].map(input => input.value);
      const ok = questions[current].answers.every((answer, index) => clean(values[index]) === clean(answer));
      if (ok && results[current] !== true) correct++;
      if (!ok && results[current] === true) correct--;
      results[current] = ok;
      document.querySelector('#feedback').innerHTML = ok ? '<span class="good">✓ 正确！做得好。</span>' : '<span class="bad">还差一点，再想一想，或点击“显示答案”。</span>';
      score.textContent = `答对 ${correct} / ${questions.length}`;
    }
    function previous() { if (current === 0) return; current--; answerVisible=false; render(); }
    function next() { if (current === questions.length - 1) { current=0; correct=0; results=[]; } else current++; answerVisible=false; render(); }
    function escapeHtml(str) { return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    document.querySelector('#load').onclick = () => { localStorage.setItem('recite-source', source.value); questions=parse(source.value); current=0;correct=0;results=[];answerVisible=false;render(); document.querySelector('details').open=false; };
    document.querySelector('#generate').onclick = () => {
      const rawText = document.querySelector('#plain-text').value;
      const formatted = formatPlainText(rawText);
      const status = document.querySelector('#generator-status');
      if (!rawText.trim()) { status.textContent = '请先粘贴需要挖空的文本。'; return; }
      if (!formatted) { status.textContent = '没有找到可挖空的重点词，请换一段内容试试。'; return; }
      source.value = formatted;
      localStorage.setItem('recite-source', formatted);
      questions = parse(formatted); current = 0; correct = 0; results = []; answerVisible = false;
      render();
      status.textContent = `已生成 ${questions.length} 道题。可在下方“替换学习文本”中编辑题目格式。`;
      document.querySelector('.study').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    questions=parse(source.value); render();
  </script>
</body>
</html>
